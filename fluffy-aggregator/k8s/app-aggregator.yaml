---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluffy-aggregator
  labels:
    app: fluffy-aggregator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluffy-aggregator
  template:
    metadata:
      labels:
        app: fluffy-aggregator
    spec:
      containers:
        - name: fluffy-aggregator
          image: fluffy-aggregator:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m -Xms128m -XX:MaxMetaspaceSize=96m -Xss512k"
            - name: FLUFFY_AGGREGATOR_TITLE
              value: "Fluffy Example - Aggregator"
            - name: FLUFFY_AGGREGATOR_NODES_0_
              value: "http://fluffy-batch-example:8080"
            - name: FLUFFY_AGGREGATOR_NODES_1_
              value: "http://fluffy-batch-h2:8080"
            - name: FLUFFY_AGGREGATOR_NODES_2_
              value: "http://fluffy-batch-db:8080"
            - name: FLUFFY_AGGREGATOR_NODES_3_
              value: "http://fluffy-batch-kafka:8080"
            - name: FLUFFY_AGGREGATOR_POLL_INTERVAL_SECONDS
              value: "10"
            - name: FLUFFY_AGGREGATOR_EXTERNAL_URL_MAPPINGS
              value: "http://fluffy-batch-example:8080=http://localhost:8080,http://fluffy-batch-h2:8080=http://localhost:8081,http://fluffy-batch-db:8080=http://localhost:8082,http://fluffy-batch-kafka:8080=http://localhost:8083"
          startupProbe:
            httpGet:
              path: /api/aggregator/config
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/aggregator/config
              port: 8084
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/aggregator/summary
              port: 8084
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: fluffy-aggregator
spec:
  selector:
    app: fluffy-aggregator
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30084
  type: NodePort
