---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluffy-batch-kafka
  namespace: fluffy-example-1
  labels:
    app: fluffy-batch-kafka
    backend: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluffy-batch-kafka
  template:
    metadata:
      labels:
        app: fluffy-batch-kafka
        backend: kafka
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do
                echo "Waiting for Kafka..."
                sleep 2
              done
      containers:
        - name: fluffy-batch-kafka
          image: fluffy-batch-example:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m -Xms128m -XX:MaxMetaspaceSize=96m -Xss512k"
            - name: FLUFFY_BATCH_DASHBOARD_TITLE
              value: "Fluffy Example - Kafka"
            - name: SPRING_PROFILES_ACTIVE
              value: "kafka"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          startupProbe:
            httpGet:
              path: /api/jobs/registered
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/jobs/registered
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/jobs/registered
              port: 8080
            periodSeconds: 15
          resources:
            requests:
              memory: "320Mi"
              cpu: "200m"
            limits:
              memory: "640Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: fluffy-batch-kafka
  namespace: fluffy-example-1
spec:
  selector:
    app: fluffy-batch-kafka
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30083
  type: NodePort
