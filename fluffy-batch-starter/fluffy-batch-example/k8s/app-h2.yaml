---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluffy-batch-h2
  namespace: fluffy-example-1
  labels:
    app: fluffy-batch-h2
    backend: h2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluffy-batch-h2
  template:
    metadata:
      labels:
        app: fluffy-batch-h2
        backend: h2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: fluffy-batch-h2
          image: fluffy-batch-example:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx256m -Xms128m -XX:MaxMetaspaceSize=96m -Xss512k"
            - name: FLUFFY_BATCH_DASHBOARD_TITLE
              value: "Fluffy Example - H2"
          startupProbe:
            httpGet:
              path: /api/jobs/registered
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/jobs/registered
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/jobs/registered
              port: 8080
            periodSeconds: 15
          resources:
            requests:
              memory: "320Mi"
              cpu: "200m"
            limits:
              memory: "640Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: fluffy-batch-h2
  namespace: fluffy-example-1
spec:
  selector:
    app: fluffy-batch-h2
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
  type: NodePort
