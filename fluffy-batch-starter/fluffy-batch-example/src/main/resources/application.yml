spring:
  datasource:
    url: jdbc:h2:mem:fluffydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  threads:
    virtual:
      enabled: true

server:
  port: 8080

fluffy:
  batch:
    backend:
      type: h2
    dashboard:
      enabled: true
      title: Fluffy Batch Dashboard
    metrics:
      enabled: true
    aggregator:
      enabled: false
      title: Fluffy Aggregator Dashboard
      # To enable the aggregator, set enabled: true and list node URLs:
      # nodes:
      #   - http://localhost:8081
      #   - http://localhost:8082
      # poll-interval-seconds: 10
      # discovery-interval-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fluffy: DEBUG
