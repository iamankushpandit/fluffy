spring:
  datasource:
    url: jdbc:h2:mem:fluffydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  threads:
    virtual:
      enabled: true

server:
  port: 8080

fluffy:
  batch:
    backend:
      type: h2
    dashboard:
      enabled: true
      title: Fluffy Batch Dashboard
    metrics:
      enabled: true
    cron:
      enabled: true
      schedules:
        report-generation: "0 30 2 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.fluffy: DEBUG
